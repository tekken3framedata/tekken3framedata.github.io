<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T3FD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        h2 { font-size: 1.25rem; margin: 1.5rem 0 0.75rem; color: #94a3b8; }
        input[type="text"] {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 1rem;
        }
        .filters { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn {
            padding: 0.25rem 0.75rem;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .filter-btn.active { background: #334155; color: #e2e8f0; border-color: #60a5fa; }
        table { border-collapse: collapse; width: 100%; }
        td:nth-child(4), th:nth-child(4),
        td:nth-child(5), th:nth-child(5),
        td:nth-child(6), th:nth-child(6) { white-space: nowrap; }
        .col-stance, .col-narrow { width: 1%; white-space: nowrap; }
        th, td { padding: 0.5rem 1rem; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; }
        .comment { color: #64748b; font-size: 0.875rem; }
        .move-list { cursor: pointer; }
        .move-list:hover { background: #1e293b; }
        .result-info { color: #64748b; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .unverified td { opacity: 0.4; }
        .unverified:hover td { opacity: 0.7; }
        .section-label { color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem 0.25rem; margin-top: 1.5rem; }
        .toggle-potential {
            margin-top: 1.5rem;
            padding: 0.4rem 0.75rem;
            background: none;
            border: 1px solid #334155;
            color: #64748b;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .toggle-potential:hover { color: #e2e8f0; border-color: #60a5fa; }
        dialog {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            inset: 4rem;
            margin: 0;
            width: auto;
            max-width: none;
            height: auto;
            max-height: none;
            padding: 2rem;
            color: #e2e8f0;
            overflow-y: auto;
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            outline: none;
        }
        .modal-close:hover { color: #e2e8f0; }
    </style>
</head>
<body>
    <h1>T3FD — Tekken 3 Frame Data</h1>

    <input type="text" id="search" placeholder="Etsi liikettä (esim. deathfist, dragon tail)">
    <label style="display:inline-flex;align-items:center;gap:0.4rem;margin-bottom:1rem;font-size:0.875rem;color:#94a3b8;cursor:pointer">
        <input type="checkbox" id="toggle-move-name"> Näytä liikkeen nimi
    </label>

    <div id="move-results"></div>

    <dialog id="punish-dialog">
        <button class="modal-close" id="modal-close">&times;</button>
        <h2 id="punish-title"></h2>
        <div class="filters" id="char-filters"></div>
        <div class="section-label">Tarkistetut rankaisut</div>
        <div id="verified-table"></div>
        <button class="toggle-potential" id="toggle-potential">Näytä mahdolliset rankaisut</button>
        <div id="potential-table" hidden></div>
    </dialog>

    <script>
        let moves = [];
        let counters = [];
        let selectedCharacters = new Set();

        Promise.all([
            fetch('./framedata.tsv').then(r => r.text()),
            fetch('./counters.tsv').then(r => r.text())
        ]).then(([movesTsv, countersTsv]) => {
            const parseRows = tsv => {
                const [header, ...lines] = tsv.trim().split('\n');
                const keys = header.split('\t');
                return lines.map(line => {
                    const vals = line.split('\t');
                    const obj = {};
                    keys.forEach((k, i) => obj[k] = vals[i] || '');
                    return obj;
                });
            };
            moves = parseRows(movesTsv).map(m => ({
                id: m.UUID,
                character: m.Character || '',
                move: m['Move Name'] || '',
                command: m.Command || '',
                startup: m.Speed || '',
                block: m['Block Adv'] || '',
                hit: m['Hit Adv'] || '',
                ch: m['CH Adv'] || '',
                stance: m.Stance || '',
                type: m.Type || '',
                damage: m.Damage || '',
                hitRange: m['Hit Range'] || '',
                properties: m.Properties || '',
                notes: m.Notes || ''
            }));
            counters = parseRows(countersTsv);
            renderMoveList();
        });

        const search = document.getElementById('search');
        const moveResults = document.getElementById('move-results');
        const dialog = document.getElementById('punish-dialog');
        const modalClose = document.getElementById('modal-close');
        const punishTitle = document.getElementById('punish-title');
        const charFilters = document.getElementById('char-filters');
        const verifiedTable = document.getElementById('verified-table');
        const potentialTable = document.getElementById('potential-table');
        const togglePotential = document.getElementById('toggle-potential');

        const toggleMoveName = document.getElementById('toggle-move-name');
        let showMoveName = false;
        let currentMoveId = null;

        toggleMoveName.addEventListener('change', () => {
            showMoveName = toggleMoveName.checked;
            renderMoveList();
        });

        function renderMoveList() {
            const q = search.value.toLowerCase().trim();

            const visible = moves.filter(m => m.type !== '10string' && m.type !== 'throw');
            const matched = q
                ? visible.filter(m =>
                    m.move.toLowerCase().includes(q) ||
                    m.command.toLowerCase().includes(q) ||
                    m.character.toLowerCase().includes(q))
                : visible;

            const moveCol = showMoveName ? '<th>Liike</th>' : '';
            const headerRow = `<thead><tr><th class="col-stance">Stance</th><th>Komento</th>${moveCol}<th class="col-narrow">Startup</th><th class="col-narrow">Block</th></tr></thead>`;

            const grouped = groupByCharacter(matched);
            let html = '';
            for (const [char, rows] of grouped) {
                html += `<h2>${char}</h2><table>${headerRow}<tbody>`;
                for (const m of rows) {
                    html += `<tr class="move-list" data-id="${m.id}"><td class="col-stance">${(m.stance === 'Default' || m.stance === 'Crouching') ? '' : m.stance}</td><td>${m.command}</td>${showMoveName ? `<td>${m.move}</td>` : ''}<td class="col-narrow">${m.startup}</td><td class="col-narrow">${m.block}</td></tr>`;
                }
                html += '</tbody></table>';
            }
            moveResults.innerHTML = html;
        }

        search.addEventListener('input', renderMoveList);

        moveResults.addEventListener('click', e => {
            const row = e.target.closest('tr[data-id]');
            if (!row) return;
            showPunishes(row.dataset.id);
        });

        function showPunishes(moveId) {
            const move = moves.find(m => m.id === moveId);
            if (!move) return;

            currentMoveId = moveId;
            const blockFrames = parseInt(move.block);

            punishTitle.textContent = `${move.character} ${move.move || move.command} (${move.block}) — rankaisut`;
            potentialTable.hidden = true;
            togglePotential.textContent = 'Näytä mahdolliset rankaisut';
            document.body.style.overflow = 'hidden';
            dialog.showModal();

            const verifiedIds = new Set(
                counters.filter(c => c.move_id === moveId).map(c => c.countered_by_id)
            );

            const allChars = [...new Set(moves.map(m => m.character))];
            selectedCharacters = new Set(allChars);

            charFilters.innerHTML = allChars.map(c =>
                `<button class="filter-btn active" data-char="${c}">${c}</button>`
            ).join('');

            renderAll();
        }

        dialog.addEventListener('close', () => {
            document.body.style.overflow = '';
        });

        modalClose.addEventListener('click', () => dialog.close());

        togglePotential.addEventListener('click', () => {
            const hidden = potentialTable.hidden;
            potentialTable.hidden = !hidden;
            togglePotential.textContent = hidden ? 'Piilota mahdolliset rankaisut' : 'Näytä mahdolliset rankaisut';
        });

        charFilters.addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            const char = btn.dataset.char;
            if (selectedCharacters.has(char)) {
                selectedCharacters.delete(char);
                btn.classList.remove('active');
            } else {
                selectedCharacters.add(char);
                btn.classList.add('active');
            }
            renderAll();
        });

        function groupByCharacter(items) {
            const map = new Map();
            for (const item of items) {
                if (!map.has(item.character)) map.set(item.character, []);
                map.get(item.character).push(item);
            }
            return map;
        }

        function renderGroupedTables(items, headerRow, rowFn) {
            const grouped = groupByCharacter(items);
            let html = '';
            for (const [char, rows] of grouped) {
                html += `<h2>${char}</h2><table>${headerRow}<tbody>`;
                for (const p of rows) html += rowFn(p);
                html += '</tbody></table>';
            }
            return html;
        }

        function renderAll() {
            if (!currentMoveId) return;
            const move = moves.find(m => m.id === currentMoveId);
            const blockFrames = parseInt(move.block);

            const verifiedCounters = counters
                .filter(c => c.move_id === currentMoveId)
                .map(c => ({ ...moves.find(m => m.id === c.countered_by_id), comment: c.comment }))
                .filter(p => p.id && selectedCharacters.has(p.character));

            const verifiedIds = new Set(
                counters.filter(c => c.move_id === currentMoveId).map(c => c.countered_by_id)
            );

            const lastRange = (move.hitRange || '').split(',').pop().trim().toLowerCase();
            const targetIsLow = lastRange === 'l';
            const targetIsSpecial = lastRange === 's';

            const potential = (isNaN(blockFrames) || blockFrames >= 0) ? [] : moves
                .filter(m => {
                    if (verifiedIds.has(m.id) || m.id === currentMoveId) return false;
                    if (m.type === 'throw') return false;
                    if (!selectedCharacters.has(m.character)) return false;
                    if (!m.startup) return false;
                    if (parseInt(m.startup) > Math.abs(blockFrames)) return false;
                    if (m.stance === 'Crouching' && !targetIsLow && !targetIsSpecial) return false;
                    if (m.stance === 'Default' && targetIsLow) return false;
                    return true;
                })
                .sort((a, b) => a.character.localeCompare(b.character) || parseInt(a.startup) - parseInt(b.startup));

            verifiedTable.innerHTML = verifiedCounters.length === 0 ? '' :
                renderGroupedTables(verifiedCounters,
                    '<thead><tr><th>Liike</th><th>Komento</th><th>Startup</th><th>Huomio</th></tr></thead>',
                    p => `<tr><td>${p.move}</td><td>${p.command}</td><td>${p.startup}</td><td class="comment">${p.comment || ''}</td></tr>`
                );

            togglePotential.style.display = potential.length === 0 ? 'none' : '';
            potentialTable.innerHTML = potential.length === 0 ? '' :
                renderGroupedTables(potential,
                    '<thead><tr><th>Liike</th><th>Komento</th><th>Startup</th><th></th></tr></thead>',
                    p => `<tr class="unverified"><td>${p.move}</td><td>${p.command}</td><td>${p.startup}</td><td></td></tr>`
                );
        }
    </script>
</body>
</html>
